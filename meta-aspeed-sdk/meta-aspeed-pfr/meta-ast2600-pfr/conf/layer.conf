# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ast2600-pfr-layer"
BBFILE_PATTERN_ast2600-pfr-layer := "^${LAYERDIR}/"
LAYERSERIES_COMPAT_ast2600-pfr-layer = "whinlatter walnascar"
