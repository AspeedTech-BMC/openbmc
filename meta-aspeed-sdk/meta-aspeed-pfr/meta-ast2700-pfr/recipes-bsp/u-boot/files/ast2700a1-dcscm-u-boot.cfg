CONFIG_ASPEED_LTPI_GPIO=y
CONFIG_BOOTCOMMAND="ltpi -m 1 -T 1000;echo Boot from spi; fdt addr ${fdtspiaddr} && fdt header get fitsize totalsize && cp.b ${fdtspiaddr} ${loadaddr} ${fitsize}; setexpr linkst *0x14c34108 '&' 0x01000007; setexpr linkst2 *0x14c35108 '&' 0x01000007; if test ${linkst2} = 1000007; then bootm 403000000#conf-ast2700a1-dcscm_ast1700a1-evb-dual.dtb; fi; if test ${linkst} = 1000007; then bootm 403000000#conf-ast2700a1-dcscm_ast1700a1-evb.dtb; fi; echo Boot ast2700-dcscm; bootm 403000000#conf-ast2700a1-dcscm.dtb;"
