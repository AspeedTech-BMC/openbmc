# Mode: either bus-owner, endpoint or unknown
mode = "bus-owner"

# MCTP protocol configuration. Used for both endpoint and bus-owner modes.
[mctp]
message_timeout_ms = 30

# bus-owner configuration
[bus-owner]

# dynamic EID range: a 2-element array of min and max (inclusive) EID values.
dynamic_eid_range = [123, 254]

max_pool_size = 15

# Bus Owner/bridge polling interval (ms) to check endpoint accessibility.
# A value of 0 disables polling.
endpoint_poll_ms = 0
