# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ast2700-sdk-layer"
BBFILE_PATTERN_ast2700-sdk-layer := "^${LAYERDIR}/"
LAYERSERIES_COMPAT_ast2700-sdk-layer = "wrynose whinlatter"

# ast27x5 does not require zephyr-aspeed-bootmcu, so the bbappend must
# not be parsed unconditionally. Place it in a dynamic-layer so it is
# only activated when the zephyrcore layer is present in the build.
BBFILES_DYNAMIC += " \
    zephyrcore:${LAYERDIR}/dynamic-layers/zephyrcore-layer/recipes-*/*/*.bb \
    zephyrcore:${LAYERDIR}/dynamic-layers/zephyrcore-layer/recipes-*/*/*.bbappend \
"
