require conf/machine/include/ast2700-sdk.inc
require conf/machine/include/ast-ssp.inc
require conf/machine/include/ast-irot.inc
require conf/machine/include/ast2700-secure-customize-gen.inc
require conf/machine/include/obmc-bsp-common.inc

# Overwrite flash layout
FLASH_SIZE = "131072"
FLASH_CALIPTRA_SIZE:flash-131072 = "128"
FLASH_BMCU_SIZE:flash-131072 = "896"
FLASH_UBOOT_OFFSET:flash-131072 = "0"
FLASH_UBOOT_ENV_OFFSET:flash-131072 = "4096"
FLASH_KERNEL_OFFSET:flash-131072 = "4224"
FLASH_ROFS_OFFSET:flash-131072 = "13440"
FLASH_RWFS_OFFSET:flash-131072 = "98304"
RWFS_SIZE = "33554432"

# The original Caliptra manifest image is located at 0x100000 (1024KB), and it
# contains the following binaries: U-Boot raw image, OPTEE OS, ATF, SSP and TSP.
#
# For the AST2700 iRoT image, the same binaries are included, but the flash
# layout has been modified as follows and Caliptra manifest image now contains
# only SSP:
#
# - 0x020000 (896KB) -> Zephyr BootMCU-FMC runtime firmware
# - 0x100000 (1024KB) -> Caliptra manifest image containing only SSP
# - 0x200000 (2048KB) -> ATF
# - 0x210000 (2112KB) -> U-Boot raw image (u-boot.bin + u-boot.dtb)
# - 0x310000 (3136KB) -> OPTEE OS
#
# This new layout allows us to reuse the existing scripts. The IROT_IMAGE
# will still be placed at 0x100000 (1024KB), just like the original Caliptra
# manifest image at 0x100000 (1024KB). Therefore, the only change needed is to
# replace the original Caliptra manifest image with IROT_IMAGE.
#
# Additionally, the total size of the IROT_IMAGE image is
# 0x400000 (4096KB) - 0x100000 (1024KB) = 3072KB since it does not include
# Caliptra and BootMCU firmware.
#
IROT_OFFSET_MANIFEST = "0"
IROT_OFFSET_ATF = "1024"
IROT_OFFSET_UBOOT = "1088"
IROT_OFFSET_TEE = "2112"
IROT_IMAGE_SIZE = "3072"

# CALIPTRA Settings
CALIPTRA_FW_BINARY = "ast2700-caliptra-fw-v1.2.bin"
# CALIPTRA Manifest
CALIPTRA_MANIFEST_CONFIG ??= "ast2700a1-irot-manifest.toml"

# BootMCU Build Settings
BOOTMCU_FW_BINARY = "ast2700-mcu-runtime.bin"
PREFERRED_PROVIDER_virtual/bootmcu = "zephyr-aspeed-bootmcu"

# U-Boot Build Settings
UBOOT_MACHINE = "evb-ast2700_defconfig"
UBOOT_DEVICETREE = "ast2700-evb"

# Kernel Build Settings
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
KBUILD_DEFCONFIG = "aspeed_g7_defconfig"

# SSP Settings
PREFERRED_PROVIDER_virtual/ssp ?= "freertos-aspeed-ssp"
FREERTOS_SSP_MACHINE ?= "ast2700_evb_ast2700_ssp_defconfig"
FREERTOS_SSP_IMAGE ?= "${DEPLOY_DIR_IMAGE}/freertos-aspeed-ssp.bin"

MACHINE_FEATURES += "\
        obmc-phosphor-fan-mgmt \
        obmc-phosphor-chassis-mgmt \
        obmc-phosphor-flash-mgmt \
        obmc-host-ipmi \
        obmc-host-state-mgmt \
        obmc-chassis-state-mgmt \
        obmc-bmc-state-mgmt \
        "

PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-aspeed-obmc"
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
VIRTUAL-RUNTIME_obmc-host-state-manager ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"

EXTRA_IMAGEDEPENDS:append = " \
    aspeed-image-recoveryuart \
    "
