require conf/machine/include/ast2700-sdk.inc
require conf/machine/include/ast-ssp.inc
require conf/machine/include/ast-rtos.inc
require conf/machine/include/ast2700-secure-customize-gen.inc
require conf/machine/include/obmc-bsp-common.inc

# Overwrite flash layout
FLASH_SIZE = "131072"
FLASH_UBOOT_OFFSET:flash-131072 = "0"
FLASH_UBOOT_ENV_OFFSET:flash-131072 = "4096"
FLASH_KERNEL_OFFSET:flash-131072 = "4224"
FLASH_ROFS_OFFSET:flash-131072 = "13440"
FLASH_RWFS_OFFSET:flash-131072 = "98304"
RWFS_SIZE = "33554432"

# The original Caliptra Manifest flash image is located at offset 0x0 and
# contains the following components:
# - Caliptra firmware pre-built image
# - MCU runtime firmware binary
# - Caliptra SoC manifest
# - ARM Trusted Firmware (ATF)
# - OPTEE OS
# - U-Boot raw image
# - DDR4/DDR5 pre-built images
# - (Optional) SSP and TSP firmware binaries
#
# For the AST2700 RTOS image, the same set of binaries is included, but the
# flash layout has been updated. The Caliptra Manifest region now contains
# only the SSP firmware binary. The new layout includes:
# - Caliptra firmware pre-built image
# - MCU runtime firmware binary
# - Caliptra SoC manifest
# - DDR4/DDR5 pre-built images
# - SSP firmware binary
#
# The updated flash layout is defined as follows:
# - 0x000000 (   0 KB) -> Caliptra Manifest Flash image (replaced by RTOS_IMAGE)
# - 0x200000 (2048 KB) -> ARM Trusted Firmware (ATF)
# - 0x210000 (2112 KB) -> U-Boot raw image (u-boot.bin + u-boot.dtb)
# - 0x310000 (3136 KB) -> OPTEE OS
#
# This new layout allows us to reuse the existing build and packaging scripts.
# The RTOS_IMAGE will be placed at offset 0x000000 (0 KB), identical to the
# original Caliptra Manifest Flash image location. Therefore, the only required
# modification is to replace the original Caliptra Manifest Flash image with
# the newly generated RTOS_IMAGE.
#
# The total size of the RTOS_IMAGE is 0x400000 (4096 KB).
#
RTOS_OFFSET_MANIFEST = "0"
RTOS_OFFSET_ATF = "2048"
RTOS_OFFSET_UBOOT = "2112"
RTOS_OFFSET_TEE = "3136"
RTOS_IMAGE_SIZE = "4096"

# CALIPTRA Settings
CALIPTRA_FW_BINARY = "caliptra-fw.bin"
# CALIPTRA Manifest
CALIPTRA_MANIFEST_CONFIG ??= "ast2700-rtos-ecc-manifest.toml"

# BootMCU Build Settings
BOOTMCU_FW_BINARY = "ast2700-mcu-runtime.bin"

# U-Boot Build Settings
UBOOT_MACHINE = "evb-ast2700_defconfig"
UBOOT_DEVICETREE = "ast2700-evb"

# Kernel Build Settings
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
KBUILD_DEFCONFIG = "aspeed_g7_defconfig"

# SSP Settings
PREFERRED_PROVIDER_virtual/ssp ?= "freertos-aspeed-ssp"
FREERTOS_SSP_MACHINE ?= "ast2700_evb_ast2700_ssp_defconfig"
FREERTOS_SSP_IMAGE ?= "${DEPLOY_DIR_IMAGE}/freertos-aspeed-ssp.bin"

MACHINE_FEATURES += "\
        obmc-phosphor-fan-mgmt \
        obmc-phosphor-chassis-mgmt \
        obmc-phosphor-flash-mgmt \
        obmc-host-ipmi \
        obmc-host-state-mgmt \
        obmc-chassis-state-mgmt \
        obmc-bmc-state-mgmt \
        "

PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-aspeed-obmc"
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
VIRTUAL-RUNTIME_obmc-host-state-manager ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"

EXTRA_IMAGEDEPENDS:append = " \
    aspeed-image-recoveryuart \
    "
