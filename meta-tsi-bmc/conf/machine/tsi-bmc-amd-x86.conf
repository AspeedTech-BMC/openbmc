#@TYPE: Machine
#@NAME: tsi-bmc-amd-x86
#@DESCRIPTION: TSI BMC managing an AMD EPYC x86 host (Stage 7B)
#
# Target of Stage 7B: AMD APML stack (apml_sbrmi/apml_sbtsi over I3C) surfaced
# in Redfish, on top of the OOB baseline. KCS/x86-power control stay blocked
# until eSPI silicon. For Stage 1 this machine parses against the ASPEED
# AST2700 BSP stand-in; the APML services and EM topology are added in 7B.

require conf/machine/include/tsi-bmc-common.inc

# Stand-in device trees (Stage 1). Replaced by TSI BSP DTs + APML bindings.
UBOOT_DEVICETREE = "ast2700-evb"
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
