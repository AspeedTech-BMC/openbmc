#@TYPE: Machine
#@NAME: tsi-bmc-arm-host
#@DESCRIPTION: TSI BMC managing an ARM host (Stage 7A)
#
# Target of Stage 7A: ARM host interfaces (in-band IPMI, SOL over host UART,
# MCTP/PLDM over I3C, host SPI flash update, fan control). For Stage 1 this
# machine parses against the ASPEED AST2700 BSP stand-in; the host-interface
# packages and entity-manager host topology are added in Stage 7A.

require conf/machine/include/tsi-bmc-common.inc

# Stand-in device trees (Stage 1). Replaced by TSI BSP DTs + host bindings.
UBOOT_DEVICETREE = "ast2700-evb"
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"

# Stage 7A adds the in-band host IPMI/console/PLDM stack, e.g.:
# MACHINE_FEATURES += "obmc-host-ipmi obmc-host-state-mgmt"
# PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-host"
