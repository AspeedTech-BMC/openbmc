#@TYPE: Machine
#@NAME: tsi-bmc-intel-x86
#@DESCRIPTION: TSI BMC managing an Intel x86 host (Stage 7C)
#
# Target of Stage 7C (TBD, gated on eSPI+PECI silicon): in-band x86 IPMI over
# eSPI/LPC/KCS, x86-power-control, host POST codes, and PECI thermal telemetry.
# For Stage 1 this machine parses against the ASPEED AST2700 BSP stand-in; the
# eSPI/KCS/PECI drivers and services are added in 7C once silicon is available.

require conf/machine/include/tsi-bmc-common.inc

# Stand-in device trees (Stage 1). Replaced by TSI BSP DTs + eSPI/PECI bindings.
UBOOT_DEVICETREE = "ast2700-evb"
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
