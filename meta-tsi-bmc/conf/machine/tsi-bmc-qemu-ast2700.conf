#@TYPE: Machine
#@NAME: tsi-bmc-qemu-ast2700
#@DESCRIPTION: TSI BMC QEMU bring-up machine (ASPEED AST2700 BSP stand-in)
#
# Stage 1 primary target. Reuses the ASPEED AST2700 SDK BSP so the TSI OOB
# image can be built and booted on the QEMU "ast2700a1-evb" model with boot
# parity against the reference ast2700-default, but on the 64 MiB TSI NOR
# layout (tsi-flash-layout.inc). The TSI BSP machines (tsisim/evb) take over
# from this stand-in in later stages.

require conf/machine/include/tsi-bmc-common.inc

# AST2700 EVB device trees for QEMU parity with the reference image.
UBOOT_DEVICETREE = "ast2700-evb"
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
