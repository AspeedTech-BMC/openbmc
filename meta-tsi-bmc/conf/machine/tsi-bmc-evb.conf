#@TYPE: Machine
#@NAME: tsi-bmc-evb
#@DESCRIPTION: TSI BMC on EVB silicon
#
# Target of Stage 6: first TSI silicon on the evaluation board (PHY/strap/flash
# tuning, CMRT/SMC secure boot). For Stage 1 this machine parses against the
# ASPEED AST2700 BSP stand-in.
#
# Stage 6 swaps the stand-in for the TSI BSP and adds board specifics:
#   PREFERRED_PROVIDER_virtual/kernel = "linux-tsi"
#   PREFERRED_PROVIDER_u-boot         = "u-boot-tsi"
#   UBOOT_DEVICETREE  = "tsi-bmc-evb"
#   KERNEL_DEVICETREE = "tsi/tsi-bmc-evb.dtb"

require conf/machine/include/tsi-bmc-common.inc

# Stand-in device trees (Stage 1). Replaced by TSI BSP DTs in Stage 6.
UBOOT_DEVICETREE = "ast2700-evb"
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
