#@TYPE: Machine
#@NAME: tsi-bmc-tsisim
#@DESCRIPTION: TSI BMC on the TSISIM functional simulator
#
# Target of Stage 4/5: full OpenBMC OOB stack on the TSISIM model using the
# real TSI BSP. For Stage 1 this machine parses against the ASPEED AST2700 BSP
# stand-in so the layer is consistent end to end.
#
# Stage 4 swaps the stand-in for the TSI BSP, e.g.:
#   PREFERRED_PROVIDER_virtual/kernel = "linux-tsi"
#   PREFERRED_PROVIDER_u-boot         = "u-boot-tsi"
#   KMACHINE          = "tsi"
#   UBOOT_DEVICETREE  = "tsi-bmc-tsisim"
#   KERNEL_DEVICETREE = "tsi/tsi-bmc-tsisim.dtb"

require conf/machine/include/tsi-bmc-common.inc

# Stand-in device trees (Stage 1). Replaced by TSI BSP DTs in Stage 4.
UBOOT_DEVICETREE = "ast2700-evb"
KERNEL_DEVICETREE = "aspeed/ast2700-evb.dtb"
