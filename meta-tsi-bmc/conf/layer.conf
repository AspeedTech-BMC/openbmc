# meta-tsi-bmc layer configuration
#
# Stage 1 skeleton for TSI BMC OpenBMC support. The machines defined here
# currently reuse the ASPEED AST2700 SDK as a "BSP stand-in" so the OOB stack
# can be built and booted on QEMU before the real TSI BSP lands (Stage 3/4).

# We have conf and recipe directories, add to BBPATH and BBFILES
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tsi-bmc-layer"
BBFILE_PATTERN_tsi-bmc-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_tsi-bmc-layer = "10"

LAYERVERSION_tsi-bmc-layer = "1"
LAYERSERIES_COMPAT_tsi-bmc-layer = "nanbield scarthgap"

# Stage 1 uses the ASPEED AST2700 SDK as the BSP stand-in, so those layers must
# be present in bblayers.conf alongside this one.
LAYERDEPENDS_tsi-bmc-layer = "core phosphor-layer aspeed-sdk-layer ast2700-sdk-layer"

# Point at the base of this layer for use elsewhere.
TSIBMCBASE = '${@os.path.normpath("${LAYERDIR}/")}'
